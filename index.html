<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostAuth | Decentralized Identity Protocol</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background-color: #000; color: #fff; }
        .mono { font-family: 'Space Mono', monospace; }
        .glass { background: rgba(15, 15, 25, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .animate-pulse-slow { animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS (Inline SVG for Zero Dependencies) ---
        const ShieldIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/></svg>;
        const KeyIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3m-3-3l-2.5-2.5"/></svg>;
        const BoxIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>;

        const App = () => {
            const [view, setView] = useState('landing');
            const [ledger, setLedger] = useState([]);
            const [user, setUser] = useState(null);
            const [form, setForm] = useState({ username: '', password: '' });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            // Core Cryptography: SHA-256
            const hash = async (str) => {
                const msgBuffer = new TextEncoder().encode(str);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            };

            const handleRegister = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                
                if (ledger.find(i => i.username === form.username)) {
                    setError("Identity already anchored to ledger.");
                    setLoading(false);
                    return;
                }

                const identityHash = await hash(form.password);
                const prevHash = ledger.length > 0 ? ledger[ledger.length - 1].blockHash : "0x0000000000000000";
                
                setTimeout(() => {
                    const block = {
                        username: form.username,
                        identityHash,
                        prevHash,
                        blockHash: "0x" + Math.random().toString(16).slice(2, 10) + Math.random().toString(16).slice(2, 10),
                        timestamp: new Date().toLocaleTimeString(),
                        height: ledger.length + 1
                    };
                    setLedger([...ledger, block]);
                    setLoading(false);
                    setView('login');
                    setForm({ username: '', password: '' });
                }, 1000);
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                const entry = ledger.find(i => i.username === form.username);
                const inputHash = await hash(form.password);

                setTimeout(() => {
                    if (entry && entry.identityHash === inputHash) {
                        setUser(entry);
                        setView('dashboard');
                    } else {
                        setError("Cryptographic verification failed.");
                    }
                    setLoading(false);
                }, 800);
            };

            return (
                <div className="min-h-screen pb-20">
                    <nav className="flex justify-between items-center px-8 py-6 glass sticky top-0 z-50">
                        <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('landing')}>
                            <div className="p-2 bg-purple-600 rounded-lg shadow-lg shadow-purple-900/40">
                                <ShieldIcon />
                            </div>
                            <span className="text-2xl font-bold tracking-tighter italic">GHOST<span className="text-purple-500">AUTH</span></span>
                        </div>
                        <div className="flex gap-6 items-center">
                            {view === 'landing' && (
                                <>
                                    <button onClick={() => setView('login')} className="hover:text-purple-400 transition font-medium text-sm">ACCESS</button>
                                    <button onClick={() => setView('register')} className="bg-white text-black px-6 py-2 rounded-full font-bold text-xs tracking-widest hover:bg-purple-500 hover:text-white transition">GENERATE DID</button>
                                </>
                            )}
                            {user && <button onClick={() => {setUser(null); setView('landing');}} className="text-red-500 text-xs font-bold border border-red-500/30 px-4 py-2 rounded-full">TERMINATE</button>}
                        </div>
                    </nav>

                    <main className="max-w-5xl mx-auto px-8 mt-12">
                        {view === 'landing' && (
                            <div className="text-center">
                                <div className="inline-block px-4 py-1 rounded-full border border-purple-500/30 text-purple-500 text-[10px] font-black tracking-widest mb-6 animate-pulse-slow">
                                    NODE STATUS: ACTIVE | PROTOCOL: DID-V1
                                </div>
                                <h1 className="text-7xl font-black mb-6 tracking-tighter leading-none">
                                    DECENTRALIZED <br/><span className="text-purple-600">IDENTITY</span> LEDGER
                                </h1>
                                <p className="text-slate-400 text-lg mb-16 max-w-2xl mx-auto">
                                    GhostAuth secures access using local SHA-256 hashing. No passwords travel the network. No central database to leak.
                                </p>

                                <div className="grid md:grid-cols-3 gap-8 text-left mb-24">
                                    <div className="p-8 glass rounded-3xl group hover:border-purple-500/50 transition-all">
                                        <div className="text-purple-500 mb-4"><KeyIcon /></div>
                                        <h3 className="text-xl font-bold mb-2">Zero-Knowledge</h3>
                                        <p className="text-slate-500 text-sm">Verify identity without revealing the underlying secret key.</p>
                                    </div>
                                    <div className="p-8 glass rounded-3xl group hover:border-purple-500/50 transition-all">
                                        <div className="text-purple-500 mb-4"><BoxIcon /></div>
                                        <h3 className="text-xl font-bold mb-2">Immutable Blocks</h3>
                                        <p className="text-slate-500 text-sm">Identity anchored to a cryptographic chain that cannot be edited.</p>
                                    </div>
                                    <div className="p-8 glass rounded-3xl group hover:border-purple-500/50 transition-all">
                                        <div className="text-purple-500 mb-4"><ShieldIcon /></div>
                                        <h3 className="text-xl font-bold mb-2">Non-Custodial</h3>
                                        <p className="text-slate-500 text-sm">The user retains full control of their cryptographic fingerprint.</p>
                                    </div>
                                </div>

                                <div className="text-left">
                                    <h2 className="text-2xl font-bold mb-8 flex items-center gap-3">
                                        <div className="w-2 h-2 bg-purple-500 rounded-full"></div> PROTOCOL EXPLORER
                                    </h2>
                                    {ledger.length === 0 ? (
                                        <div className="p-12 border border-dashed border-white/10 rounded-3xl text-center text-slate-600 font-mono text-xs">
                                            AWAITING GENESIS IDENTITY...
                                        </div>
                                    ) : (
                                        <div className="space-y-4">
                                            {ledger.map((b, i) => (
                                                <div key={i} className="glass p-6 rounded-2xl flex flex-col md:flex-row gap-6 items-center">
                                                    <div className="w-16 h-16 bg-purple-900/20 rounded-xl flex flex-col items-center justify-center border border-purple-500/20">
                                                        <span className="text-[10px] text-purple-500 font-bold uppercase">Block</span>
                                                        <span className="text-xl font-black">{b.height}</span>
                                                    </div>
                                                    <div className="flex-grow min-w-0">
                                                        <div className="flex justify-between mb-2">
                                                            <span className="font-bold text-purple-400">{b.username}</span>
                                                            <span className="text-[10px] text-slate-600">{b.timestamp}</span>
                                                        </div>
                                                        <div className="mono text-[10px] text-slate-400 space-y-1">
                                                            <div className="truncate"><span className="text-slate-600">DID_HASH:</span> {b.identityHash}</div>
                                                            <div className="truncate"><span className="text-slate-600">PREV_LINK:</span> {b.prevHash}</div>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {(view === 'register' || view === 'login') && (
                            <div className="max-w-md mx-auto mt-20 glass p-10 rounded-[2.5rem] border-purple-500/20">
                                <h2 className="text-4xl font-black mb-2 tracking-tighter">
                                    {view === 'register' ? 'COMMIT' : 'VERIFY'}
                                </h2>
                                <p className="text-slate-500 text-sm mb-8 italic">
                                    {view === 'register' ? 'Anchor your fingerprint to the chain.' : 'Prove possession of secret key.'}
                                </p>
                                <form onSubmit={view === 'register' ? handleRegister : handleLogin} className="space-y-6">
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-600 uppercase tracking-widest block mb-2">Alias</label>
                                        <input type="text" required value={form.username} onChange={e => setForm({...form, username: e.target.value})} className="w-full bg-black border border-white/10 p-4 rounded-2xl focus:outline-none focus:border-purple-500 transition"/>
                                    </div>
                                    <div>
                                        <label className="text-[10px] font-bold text-slate-600 uppercase tracking-widest block mb-2">Secret Key</label>
                                        <input type="password" required value={form.password} onChange={e => setForm({...form, password: e.target.value})} className="w-full bg-black border border-white/10 p-4 rounded-2xl focus:outline-none focus:border-purple-500 transition"/>
                                    </div>
                                    {error && <p className="text-red-500 text-xs font-bold bg-red-500/10 p-3 rounded-lg border border-red-500/20">{error}</p>}
                                    <button disabled={loading} className="w-full bg-purple-600 py-4 rounded-2xl font-black uppercase tracking-widest text-xs hover:bg-purple-500 transition active:scale-95 disabled:opacity-50">
                                        {loading ? "PROCESSING..." : (view === 'register' ? "BROADCAST TO LEDGER" : "EXECUTE PROOF")}
                                    </button>
                                </form>
                            </div>
                        )}

                        {view === 'dashboard' && user && (
                            <div className="mt-12 animate-in fade-in duration-500">
                                <div className="glass rounded-[3rem] overflow-hidden">
                                    <div className="h-48 bg-gradient-to-r from-purple-900 to-black p-10 flex items-end">
                                        <div className="w-24 h-24 bg-black border-4 border-slate-900 rounded-3xl flex items-center justify-center text-purple-500 mb-[-60px] shadow-2xl relative z-10">
                                            <ShieldIcon />
                                        </div>
                                    </div>
                                    <div className="p-10 pt-16">
                                        <div className="flex justify-between items-start mb-8">
                                            <div>
                                                <h1 className="text-4xl font-black">{user.username}</h1>
                                                <p className="text-slate-500 font-mono text-sm">DID_HOLDER_VERIFIED</p>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-emerald-500 font-black text-[10px] tracking-widest uppercase">Validated</div>
                                                <div className="text-slate-600 text-[10px] font-mono">BLOCK: {user.height}</div>
                                            </div>
                                        </div>
                                        <div className="p-6 bg-black/50 border border-white/5 rounded-2xl mb-8">
                                            <p className="text-[10px] font-bold text-slate-600 uppercase tracking-widest mb-3">Public Identification Fingerprint</p>
                                            <code className="text-purple-400 text-xs break-all mono">{user.identityHash}</code>
                                        </div>
                                        <div className="p-6 bg-purple-600/5 border border-purple-500/20 rounded-2xl">
                                            <p className="text-xs text-slate-300 leading-relaxed italic">
                                                Verification was performed using a local SHA-256 computation. No plaintext passwords were stored or transmitted.
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    <footer className="mt-32 text-center text-slate-700 text-[10px] tracking-[0.4em] font-black uppercase">
                        GhostAuth Protocol &copy; SENG 473 Information Security
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
